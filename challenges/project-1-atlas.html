   Milestones

   [ ] Everything is derived from shared fields
   [ ] At least twelve labels, none overlapping
   [ ] Palette with roles, built in OKLCH; label contrast at least 4.5
   [ ] At least three reported features that vary by seed
   [ ] PNG export at A3, 300 dpi or larger, with seed and parameters as JSON
   [ ] The same seed always gives the same map */

// The sheet is designed in millimetres. Pixels are decided once, here.
const SHEET_W = 297, SHEET_H = 420;      // A3 portrait
const PREVIEW_DPI = 72;                  // raise to 300 for the final export
const PX = PREVIEW_DPI / 25.4;           // pixels per millimetre

const canvas = document.getElementById('canvas');
canvas.width = Math.round(SHEET_W * PX);
canvas.height = Math.round(SHEET_H * PX);
const ctx = canvas.getContext('2d');

let seed = 1;

// Each stage reads what the stages before it wrote into `map`.
function generate(seed) {
  const R = PA.rng(seed), N = PA.noise(seed);
  const map = { seed, features: {} };

  // ---- 1. fields: height (and climate) sampled into arrays on a grid ----
  // ---- 2. lines: coastline and contours as arrays of [x, y] in mm ----
  // ---- 3. rivers ----
  // ---- 4. regions and settlements ----
  // ---- 5. names ----
  // ---- 6. label positions ----

  return map;
}

function render(map) {
  ctx.save();
  ctx.scale(PX, PX);                     // from here on, draw in millimetres
  ctx.fillStyle = '#f4efe6';
  ctx.fillRect(0, 0, SHEET_W, SHEET_H);

  // ---- draw the layers in order: sea, land, relief, rivers, borders, places, labels, sheet furniture ----

  ctx.restore();
}

render(generate(seed));
