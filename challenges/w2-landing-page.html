<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web design challenge · A Landing Page That Is Alive</title>
<!--
  WEB DESIGN CHALLENGE — A LANDING PAGE THAT IS ALIVE
  Full brief: ../web/02-building-real-pages.html

  Checklist
  [ ] A hero with a dual-design reveal of your own: two aligned treatments, a mask with character
  [ ] Real HTML content over and below it
  [ ] A second generative element elsewhere on the page
  [ ] One brand: two or three colours, one or two typefaces, used in the page and in the art
  [ ] Responsive from 360 px wide to a wide monitor, with no horizontal scrolling
  [ ] A good idle state, a reduced-motion still, and animation that pauses off screen
  [ ] Text is readable in every state of the hero
  [ ] The seed can be set from the page address (location.hash)
-->
<style>
  :root { --paper: #f1ece2; --ink: #1c1b19; --accent: #e4572e; }      /* your brand colours */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; }

  .hero { position: relative; height: 100vh; min-height: 420px; overflow: hidden; touch-action: pan-y; }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero .copy { position: absolute; left: 0; right: 0; bottom: 12vh; padding: 0 6vw; }
  .hero h1 { font-size: clamp(2.4rem, 9vw, 7rem); line-height: 0.95; margin: 0 0 1rem; }
  /* TODO: make the text readable over both designs */

  main { padding: 12vh 6vw; max-width: 70ch; font-size: 1.1rem; line-height: 1.7; }
</style>
</head>
<body>

<section class="hero" id="hero">
  <canvas id="canvas" aria-hidden="true"></canvas>
  <div class="copy">
    <h1>Your headline</h1>
    <p>One sentence that says what this is.</p>
  </div>
</section>

<main>
  <h2>A second section</h2>
  <p>Real content goes here, and somewhere on the page a second generative element.</p>
</main>

<script src="../assets/pa.js"></script>
<script>
const hero = document.getElementById('hero');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

// TODO: read the seed from location.hash
const seed = 'landing-1';
const R = PA.rng(seed), N = PA.noise(seed);

let W = 0, H = 0, designA = null, designB = null, visible = true;

function layer(paint) {
  const c = document.createElement('canvas');
  c.width = canvas.width; c.height = canvas.height;
  const g = c.getContext('2d');
  g.scale(canvas.width / W, canvas.height / H);
  paint(g);
  return c;
}

function build() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = hero.clientWidth; H = hero.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  designA = layer((g) => {
    // ---- your first treatment here ----
    g.fillStyle = '#f1ece2'; g.fillRect(0, 0, W, H);
  });
  designB = layer((g) => {
    // ---- your second treatment here: the same composition, a different character ----
    g.fillStyle = '#12061f'; g.fillRect(0, 0, W, H);
  });
}

const pointer = { x: 0, y: 0, active: false };
hero.addEventListener('pointermove', (e) => {
  const box = hero.getBoundingClientRect();
  pointer.x = e.clientX - box.left;
  pointer.y = e.clientY - box.top;
  pointer.active = true;
});
hero.addEventListener('pointerleave', () => { pointer.active = false; });

function frame(ms) {
  if (visible) {
    const t = ms / 1000;
    ctx.drawImage(designA, 0, 0, W, H);

    // ---- your mask and your idle behaviour here, then draw designB through the mask ----

  }
  if (!calm) requestAnimationFrame(frame);
}

new IntersectionObserver((entries) => { visible = entries[0].isIntersecting; }).observe(hero);
new ResizeObserver(() => { build(); if (calm) frame(0); }).observe(hero);

build();
if (calm) frame(0); else requestAnimationFrame(frame);
</script>
</body>
</html>
