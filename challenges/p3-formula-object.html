<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D printing challenge 2 · A Formula You Can Hold</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #cfd6dd; font: 14px/1.5 Consolas, monospace; }
  body { display: grid; place-items: center; }
  canvas { max-width: 90vmin; max-height: 80vmin; }
  #report { white-space: pre-wrap; margin: 0; padding: 12px; }
</style>
</head>
<body>
<div>
  <canvas id="canvas" width="900" height="900"></canvas>
  <pre id="report"></pre>
</div>
<script src="../assets/pa.js"></script>
<script src="../assets/mesh.js"></script>
<script>
/* 3D PRINTING CHALLENGE 2 — A FORMULA YOU CAN HOLD
   Full brief: ../printing/03-models-from-formulas.html

   Needs supports?  yes / no, because ...

   Checklist
   [ ] One distance function f(x, y, z) in millimetres, from at least three primitives
   [ ] At least three different operations, including a subtraction or shell, and a smooth blend
   [ ] At least one domain operation: twist, mirror, repetition or taper
   [ ] A minimum wall of at least 0.84 mm that holds by construction (explain why below)
   [ ] A flat base at z = 0; fits 256 x 256 x 250 mm
   [ ] Watertight for every seed or slider setting
   [ ] Sliced in Bambu Studio without errors; every wall is at least two beads

   Why the wall can never be thinner than MIN_WALL:
   ... */

const MIN_WALL = 0.84;         // millimetres: two beads from a 0.4 mm nozzle

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// helpers you will want. negative = inside
const sphere = (x, y, z, r) => Math.hypot(x, y, z) - r;
const smin = (a, b, k) => {
  const h = Math.min(1, Math.max(0, 0.5 + 0.5 * (b - a) / k));
  return b + (a - b) * h - k * h * (1 - h);
};

// ---- your object ----
function f(x, y, z) {
  return sphere(x, y, z - 20, 20);       // replace this
}

// the box to search, and how many grid cells along its longest side
const tris = MESH.fromSDF(f, [-30, -30, 0], [30, 30, 45], 48);

document.getElementById('report').textContent = MESH.report(tris).text;

function frame(ms) {
  MESH.view(ctx, W, H, tris, { spin: ms / 3000 });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// TODO: a key that calls MESH.download('object.stl', MESH.stl(tris))
</script>
</body>
</html>
